
name: Build Android APK
on:
  push:
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Use the fixed signing key
        run: |
          test -f debug.keystore || { echo "::error::debug.keystore is missing"; exit 1; }
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Install dependencies and build Android app
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
          npm install --no-audit --no-fund
          npm run build:native
          npx cap add android
          npx cap sync android

          G=android/app/build.gradle
          test -f "$G"
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 2/; s/versionName[[:space:]]+"[^"]+"/versionName "1.1"/' "$G"
          grep -q 'versionCode 2' "$G"
          grep -q 'versionName "1.1"' "$G"

          A=android/app/src/main/assets
          cmp index.html "$A/public/index.html"
          cmp www/native.js "$A/public/native.js"

          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' "$M"
          grep -q 'android.permission.SCHEDULE_EXACT_ALARM' "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <application#' "$M"
          grep -q 'android.permission.RECEIVE_BOOT_COMPLETED' "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application#' "$M"
          grep -q 'android.permission.WAKE_LOCK' "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <application#' "$M"

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify the APK contains the built web assets
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -p "$APK" assets/public/index.html | cmp - index.html
          unzip -p "$APK" assets/public/native.js | cmp - www/native.js

      - uses: actions/upload-artifact@v4
        with:
          name: enjazi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
