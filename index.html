<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سجل الإنجاز والمهام</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0E7C86"><meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#F3F6F8;--s:#fff;--tx:#14202B;--mu:#6B7886;--ac:#0E7C86;--ac2:#DDF1F3;--bd:#DFE5EA;--hi:#E5484D;--me:#C58B00;--lo:#2FA36B}
[data-th=dark]{--bg:#0E1419;--s:#17202A;--tx:#E8EEF3;--mu:#8D9BA8;--ac:#37B6C2;--ac2:#13343A;--bd:#263340}
[data-th=sepia]{--bg:#F1E8D4;--s:#FAF4E5;--tx:#3A3224;--mu:#7D705A;--ac:#8A5A2B;--ac2:#EBDDBF;--bd:#DCCFB2}
*{box-sizing:border-box;margin:0}html{font-size:16px}[data-fs=s]{font-size:14px}[data-fs=l]{font-size:19px}
body{background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:auto;padding:16px}button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
h1{font-size:1.7rem}h2{font-size:1.1rem;flex:1}h3{font-size:.85rem;color:var(--mu);margin:16px 4px 6px}h3 span{opacity:.7}
.sub,.mu,small{color:var(--mu);font-size:.8rem}.card{background:var(--s);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0}
.row,.gh,.ih,.cmp{display:flex;align-items:center;gap:8px;justify-content:space-between}
.bar{height:9px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .3s}
.in,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--s);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:4px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--s);border-radius:20px;padding:6px 14px}
.chip.on,.tabs .on{background:var(--ac);color:#fff;border-color:var(--ac)}.tabs{display:flex;gap:4px;margin-top:6px}.tabs button{flex:1;padding:8px 2px;border-radius:10px;font-size:.85rem}
.task{display:flex;gap:10px;align-items:flex-start;background:var(--s);border:1px solid var(--bd);border-radius:16px;padding:12px;margin:8px 0}
.task.dn .bd b{text-decoration:line-through;color:var(--mu)}.bd{flex:1;min-width:0}.bd p{color:var(--mu);font-size:.85rem;margin:2px 0}
.mt{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--mu);margin-top:4px}.tag{color:var(--ac);font-weight:600}.ov{color:var(--hi)}
.ck{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--mu);flex:none;display:grid;place-items:center;font-size:.9rem}
.p3{border-color:var(--hi);background:color-mix(in srgb,var(--hi) 15%,transparent)}.p2{border-color:var(--me);background:color-mix(in srgb,var(--me) 15%,transparent)}.p1{border-color:var(--lo);background:color-mix(in srgb,var(--lo) 15%,transparent)}
.dn .ck{background:var(--mu);color:#fff;border-color:var(--mu)}.ic{color:var(--mu);padding:4px}
.fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));inset-inline-end:18px;width:56px;height:56px;border-radius:18px;background:var(--ac);color:#fff;font-size:1.8rem;box-shadow:0 6px 18px #0004;z-index:5}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--s);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;padding:10px;display:flex;flex-direction:column;align-items:center;color:var(--mu);font-size:1.2rem}nav .on{color:var(--ac);font-weight:700}
.btn{background:var(--ac);color:#fff;border-radius:12px;padding:11px 16px}.btn.o{background:none;border:1px solid var(--bd);color:var(--tx)}.w{width:100%;margin:8px 0}
.it{border-top:1px solid var(--bd);padding-top:8px;margin-top:8px}.ia{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.ia button{border:1px solid var(--bd);border-radius:10px;min-width:38px;padding:5px 10px}
.lnk{color:var(--ac);margin-top:8px}.empty{text-align:center;color:var(--mu);padding:40px 10px}
.sh{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:20}.sh[hidden],.ts[hidden]{display:none}
.bx{background:var(--bg);width:100%;max-width:640px;margin:auto;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px}.bx label{display:block;font-size:.8rem;color:var(--mu);margin-top:12px}
.ts{position:fixed;top:12px;inset-inline:16px;background:var(--ac);color:#fff;padding:12px;border-radius:12px;z-index:30;text-align:center}
.two{display:flex;gap:8px}.two>*{flex:1}
.wr{position:relative;display:flex;gap:8px;justify-content:center;margin:6px 0}.wr:before{content:'';position:absolute;top:40px;height:40px;inset-inline:25%;background:var(--ac2);border-radius:10px}.wc{position:relative;height:120px;width:80px;overflow-y:auto;scroll-snap-type:y mandatory;padding:40px 0;scrollbar-width:none}.wi{height:40px;scroll-snap-align:center;display:grid;place-items:center;font-size:1.2rem}
</style></head><body>
<main id="app"></main><button id="fab" class="fab" data-a="add">＋</button><nav id="nav"></nav>
<div id="sh" class="sh" hidden></div><div id="ts" class="ts" hidden></div><input type="file" id="imp" accept=".json" hidden>
<script>
const $=s=>document.querySelector(s),K='pt2',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),p2=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=Object.assign({lang:'ar',th:'light',fs:'m',tasks:[],groups:[],cats:[]},S||{});
let v='todo',f={tab:'all',cat:'',q:'',open:0},D=null,P={g:null,i:null},ip=null;
const mig=()=>{S.tasks.forEach(x=>{if(!x.rms)x.rms=x.rm>=0?[x.rm]:[]});S.groups.forEach(g=>g.it.forEach(i=>{if(!i.ls){i.ls=[];for(let k=1;k<=(i.done||0);k++)i.ls.push({id:uid(),n:'محاضرة '+k,at:i.last||Date.now()})}}))};mig();
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e});
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}clearTimeout(save.t);save.t=setTimeout(()=>window.sched&&sched(),300)},T=(a,e)=>S.lang==='ar'?a:e,loc=()=>S.lang==='ar'?'ar-EG':'en-GB';
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const due=x=>x.d?new Date(x.d+'T'+(x.tm||'23:59')):null,od=x=>!x.x&&due(x)&&due(x)<new Date();
const pct=(a,b)=>b?Math.round(a/b*100):0,bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
const fdt=(d,tm)=>d?new Date(d+'T00:00').toLocaleDateString(loc(),{day:'numeric',month:'short'})+(tm?' '+tm:''):'';
const toast=m=>{const t=$('#ts');t.textContent=m;t.hidden=0;setTimeout(()=>t.hidden=1,4000)};
function clock(){const e=$('#clk');if(e)e.textContent=new Date().toLocaleString(loc(),{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function render(){const h=document.documentElement;h.lang=S.lang;h.dir=S.lang==='ar'?'rtl':'ltr';h.dataset.th=S.th;h.dataset.fs=S.fs;
$('#app').innerHTML=v==='todo'?todo():v==='track'?track():sets();$('#fab').hidden=v!=='todo';
$('#nav').innerHTML=[['todo','✓',T('المهام','Tasks')],['track','▤',T('الإنجاز','Progress')],['set','⚙',T('الإعدادات','Settings')]].map(([k,i,l])=>`<button class="${v===k?'on':''}" data-a="nv" data-i="${k}">${i}<small>${l}</small></button>`).join('');clock()}
const card=x=>{const s=x.sub||[],sd=s.filter(a=>a.x).length;return `<div class="task${x.x?' dn':''}"><button class="ck p${x.p}" data-a="tg" data-i="${x.id}">${x.x?'✓':''}</button><div class="bd" data-a="ed" data-i="${x.id}"><b>${E(x.t)}</b>${x.n?`<p>${E(x.n)}</p>`:''}<div class="mt">${x.c?`<span class="tag">${E(x.c)}</span>`:''}${x.d?`<span class="${od(x)?'ov':''}">📅 ${fdt(x.d,x.tm)}${x.x?'':' · '+cd(x)}</span>`:''}${(x.rms||[]).length?'<span>🔔</span>':''}${x.rp?'<span>↻</span>':''}${s.length?`<span>☑ ${sd}/${s.length}</span>`:''}${x.lk?'<span>▤</span>':''}</div></div><button class="ic" data-a="del" data-i="${x.id}">✕</button></div>`};
function lst(){const L=S.tasks.filter(x=>(!f.cat||x.c===f.cat)&&(!f.q||(x.t+' '+(x.n||'')).toLowerCase().includes(f.q)));
const act=L.filter(x=>!x.x).sort((a,b)=>(+due(a)||9e15)-(+due(b)||9e15)||b.p-a.p),dne=L.filter(x=>x.x),g={};
(f.tab==='done'?[]:f.tab==='over'?act.filter(od):act).forEach(x=>(g[x.c||T('بدون تصنيف','No category')]??=[]).push(x));
let h=Object.entries(g).map(([c,a])=>`<h3>${E(c)} <span>${a.length}</span></h3>`+a.map(card).join('')).join('');
if(f.tab==='done')h+=dne.map(card).join('');else if(f.tab==='all'&&dne.length)h+=`<div class="cmp"><button data-a="co">${f.open?'▾':'▸'} ${T('منجزة','Completed')} ${dne.length}</button><button class="ov" data-a="clr">${T('مسح','Clear')}</button></div>`+(f.open?dne.map(card).join(''):'');
return h||`<p class="empty">${T('لا توجد مهام هنا. اضغط ＋ لإضافة مهمة.','Nothing here. Tap ＋ to add a task.')}</p>`}
function todo(){const A=S.tasks,dn=A.filter(x=>x.x).length,cats=[...new Set([...S.cats,...A.map(x=>x.c).filter(Boolean)])];
return `<h1>${T('اليوم','Today')}</h1><div class="sub" id="clk"></div><div class="card"><div class="row"><b>${T('تقدم المهام','Tasks progress')}</b><b>${pct(dn,A.length)}%</b></div>${bar(pct(dn,A.length))}<small>${dn} / ${A.length} ${T('منجزة','done')}</small></div>
<div class="two"><input id="qa" class="in" placeholder="⚡ ${T('أضف سريعًا: ذاكر بكرة 5 العصر','Quick add: study tomorrow 5pm')}"><button class="btn" style="flex:none" data-a="qa">＋</button></div><input id="q" class="in" placeholder="🔍 ${T('بحث','Search')}" value="${E(f.q)}"><div class="chips"><button class="chip${f.cat?'':' on'}" data-a="fc" data-i="">${T('الكل','All')}</button>${cats.map(c=>`<button class="chip${f.cat===c?' on':''}" data-a="fc" data-i="${E(c)}">${E(c)}</button>`).join('')}</div>
<div class="tabs">${[['all',T('الكل','All'),A.length],['act',T('نشطة','Active'),A.filter(x=>!x.x).length],['over',T('متأخرة','Overdue'),A.filter(od).length],['done',T('منجزة','Done'),dn]].map(([k,l,n])=>`<button class="${f.tab===k?'on':''}" data-a="tb" data-i="${k}">${l} ${n}</button>`).join('')}</div><div id="lst">${lst()}</div>`}
const dn=i=>i.ls.length,tot=i=>Math.max(i.total,i.ls.length),sum=a=>a.reduce((r,i)=>[r[0]+dn(i),r[1]+tot(i)],[0,0]);
const cur=()=>S.groups.find(a=>a.id===P.g).it.find(a=>a.id===P.i),crumb=(...a)=>`<div class="row"><button class="ic" data-a="bk">${S.lang==='ar'?'→':'←'} ${T('رجوع','Back')}</button><small>${a.join(' › ')}</small></div>`;
const ov=(a,b,l)=>`<div class="card"><div class="row"><b>${l}</b><b>${pct(a,b)}%</b></div>${bar(pct(a,b))}<small>${a} / ${b}</small></div>`;
function track(){const G=S.groups.find(a=>a.id===P.g),I=G&&G.it.find(a=>a.id===P.i);
if(I)return crumb(E(G.n),E(I.n))+`<h1>${E(I.n)}</h1>`+ov(dn(I),tot(I),T('التقدم في المادة','Subject progress'))+`<div class="ia"><button data-a="et">✎ ${T('العدد الكلي','Total')}</button><button data-a="di">✕ ${T('حذف المادة','Delete')}</button></div>
<h3>${T('سجّل محاضرة أنجزتها','Log a finished lecture')}</h3><div class="two"><input id="nl" class="in" placeholder="${T('اسم المحاضرة (أو عدة محاضرات بفاصلة)','Lecture name (or several, comma-separated)')}"><button class="btn" style="flex:none" data-a="al">＋</button></div>`+
[...I.ls].reverse().map(l=>`<div class="task"><button class="ck p1">✓</button><div class="bd" data-a="el" data-i="${l.id}"><b>${E(l.n)}</b><div class="mt"><span>📅 ${new Date(l.at).toLocaleString(loc(),{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div></div><button class="ic" data-a="rl" data-i="${l.id}">✕</button></div>`).join('');
if(G)return crumb(E(G.n))+`<h1>📁 ${E(G.n)}</h1>`+ov(...sum(G.it),T('إنجاز القسم','Section progress'))+G.it.map(i=>`<div class="card" data-a="oi" data-i="${i.id}"><div class="ih"><b>${E(i.n)}</b><span>${dn(i)}/${tot(i)} · ${pct(dn(i),tot(i))}%</span></div>${bar(pct(dn(i),tot(i)))}</div>`).join('')+`<button class="btn w" data-a="ai" data-i="${G.id}">＋ ${T('مادة / مشروع جديد','New subject / project')}</button><button class="lnk" data-a="dg" data-i="${G.id}">✕ ${T('حذف القسم','Delete section')}</button>`;
return `<h1>${T('جدول الإنجاز','Progress')}</h1><div class="sub" id="clk"></div>`+ov(...sum(S.groups.flatMap(g=>g.it)),T('الإنجاز العام','Overall'))+S.groups.map(g=>{const[x,y]=sum(g.it);return `<div class="card" data-a="og" data-i="${g.id}"><div class="gh"><h2>📁 ${E(g.n)}</h2><b>${pct(x,y)}%</b></div>${bar(pct(x,y))}<small>${g.it.length} ${T('مادة / مشروع','items')} · ${x}/${y}</small></div>`}).join('')+`<button class="btn w" data-a="ag">＋ ${T('قسم جديد (مثل: مواد الكلية)','New section (e.g. College)')}</button>`}
const seg=(k,o)=>`<div class="chips">${o.map(([a,l])=>`<button class="chip${S[k]===a?' on':''}" data-a="st" data-k="${k}" data-i="${a}">${l}</button>`).join('')}</div>`;
function sets(){const n='Notification'in window?Notification.permission:'denied';
return `<h1>${T('الإعدادات','Settings')}</h1><div class="card"><b>${T('المظهر','Theme')}</b>${seg('th',[['light',T('فاتح','Light')],['dark',T('داكن','Dark')],['sepia',T('مريح للعين','Eye comfort')]])}<b>${T('حجم الخط','Font size')}</b>${seg('fs',[['s',T('صغير','Small')],['m',T('متوسط','Medium')],['l',T('كبير','Large')]])}<b>${T('اللغة','Language')}</b>${seg('lang',[['ar','العربية'],['en','English']])}</div>
<div class="card"><b>${T('الإشعارات','Notifications')}</b><p class="mu">${T('المهام المهمة جدًا والمتوسطة تظهر في شريط الإشعارات. التنبيهات تعمل بدقة والتطبيق مفتوح أو في الخلفية.','High and medium tasks appear in the notification shade. Reminders fire reliably while the app is open or in the background.')}</p>${LN?`<button class="btn w" data-a="nat">${T('السماح بالتنبيهات الدقيقة','Allow exact alarms')}</button><p class="mu">${T('وأوقف «توفير الطاقة» للتطبيق من إعدادات التليفون ← البطارية.','Also disable battery optimization for this app in phone settings.')}</p>`:''}<button class="btn w" data-a="en">${n==='granted'?T('✓ مفعّلة','✓ Enabled'):T('تفعيل الإشعارات','Enable notifications')}</button></div>
<div class="card"><b>${T('تثبيت على الشاشة الرئيسية','Install on home screen')}</b><button class="btn w" data-a="inst">${T('تثبيت التطبيق','Install app')}</button></div>
<div class="card"><b>${T('نسخة احتياطية','Backup')}</b><div class="two"><button class="btn o" data-a="ex">${T('تصدير','Export')}</button><button class="btn o" data-a="im">${T('استيراد','Import')}</button></div></div>`}
function openSheet(id){D=id?JSON.parse(JSON.stringify(S.tasks.find(x=>x.id===id))):{id:uid(),t:'',n:'',d:'',tm:'',rms:[],rp:'',p:2,c:'',pin:true,sub:[],lk:'',x:0};draw()}
function sync(){if(!D)return;[['t','ft'],['n','fn'],['d','fd'],['tm','ftm'],['c','fc'],['lk','fl']].forEach(([k,i])=>{const e=$('#'+i);if(e)D[k]=e.value});D.rp=$('#frp').value;D.pin=$('#fpin').checked}
function draw(){const d=D,cats=[...new Set([...S.cats,...S.tasks.map(x=>x.c).filter(Boolean)])],ad=n=>{const t=new Date();t.setDate(t.getDate()+n);return iso(t)};
const op=(a,c)=>a.map(([k,l])=>`<option value="${k}"${c==k?' selected':''}>${l}</option>`).join('');
const lk=S.groups.flatMap(g=>g.it.map(i=>[g.id+':'+i.id,E(g.n)+' ‹ '+E(i.n)]));
$('#sh').innerHTML=`<div class="bx"><h2>${S.tasks.some(x=>x.id===d.id)?T('تعديل المهمة','Edit task'):T('مهمة جديدة','New task')}</h2>
<input id="ft" class="in" placeholder="${T('المطلوب إيه؟','What needs to be done?')}" value="${E(d.t)}"><textarea id="fn" rows="2" placeholder="${T('وصف (اختياري)','Note (optional)')}">${E(d.n)}</textarea>
<label>${T('التاريخ والوقت','Date & time')}</label><div class="chips">${[[0,T('اليوم','Today')],[1,T('بكرة','Tomorrow')],[7,T('الأسبوع القادم','Next week')]].map(([n,l])=>`<button class="chip${d.d===ad(n)?' on':''}" data-a="qd" data-i="${n}">${l}</button>`).join('')}</div>
<div class="chips">${[['h',T('بعد ساعة','In 1 hour')],['n',T('الليلة','Tonight')],['m',T('بكرة 9 الصبح','Tomorrow 9am')]].map(([k,l])=>`<button class="chip" data-a="qt" data-i="${k}">${l}</button>`).join('')}</div><input id="fd" type="date" class="in" value="${d.d}"><div class="row"><b id="tl">${d.tm||'--:--'}</b><button class="chip" data-a="ct">${T('بدون وقت','No time')}</button></div><div class="wr"><div class="wc" id="wh">${Array.from({length:24},(_,i)=>`<div class="wi">${p2(i)}</div>`).join('')}</div><span style="align-self:center">:</span><div class="wc" id="wm">${Array.from({length:60},(_,i)=>`<div class="wi">${p2(i)}</div>`).join('')}</div></div>
<label>${T('تذكيرات (اختر أكتر من واحد)','Reminders (pick several)')}</label><div class="chips">${[0,10,30,60,120,1440].map(r=>`<button class="chip${d.rms.includes(r)?' on':''}" data-a="rmt" data-i="${r}">${r?rl(r)+T(' قبلها',' before'):T('في الموعد','At due time')}</button>`).join('')}</div><div><label>${T('تكرار','Repeat')}</label><select id="frp">${op([['',T('بدون','None')],['d',T('يوميًا','Daily')],['w',T('أسبوعيًا','Weekly')],['m',T('شهريًا','Monthly')],['y',T('سنويًا','Yearly')]],d.rp)}</select></div>
<label>${T('الأولوية','Priority')}</label><div class="chips">${[[3,T('مهمة جدًا','High'),'hi'],[2,T('متوسطة','Medium'),'me'],[1,T('عادية','Low'),'lo']].map(([n,l])=>`<button class="chip${d.p===n?' on':''}" data-a="pr" data-i="${n}">${l}</button>`).join('')}</div>
<label>${T('التصنيف (اكتب أي تصنيف)','Category (type any)')}</label><input id="fc" class="in" value="${E(d.c)}" placeholder="${T('شخصي، كلية، مذاكرة...','Personal, College, Study...')}"><div class="chips">${cats.map(c=>`<button class="chip" data-a="cc" data-i="${E(c)}">${E(c)}</button>`).join('')}</div>
<label><input id="fpin" type="checkbox"${d.pin?' checked':''}> ${T('ثبّت في شريط الإشعارات (للمهمة المهمة/المتوسطة)','Pin to notification shade (high/medium)')}</label>
<label>${T('مهام فرعية','Subtasks')}</label>${d.sub.map((s,i)=>`<div class="row"><label style="margin:4px 0"><input type="checkbox" data-a="ts" data-i="${i}"${s.x?' checked':''}> ${E(s.t)}</label><button class="ic" data-a="rs" data-i="${i}">✕</button></div>`).join('')}

const lkd=(x,dl)=>{if(!x.lk)return;const[g,i]=x.lk.split(':'),t=(S.groups.find(a=>a.id===g)||{it:[]}).it.find(a=>a.id===i);if(!t)return;const id='t'+x.id;t.ls=t.ls.filter(l=>l.id!==id);if(dl>0)t.ls.push({id,n:x.t,at:Date.now()})};
const nd=(d,r)=>{const t=new Date(d+'T00:00');r==='d'?t.setDate(t.getDate()+1):r==='w'?t.setDate(t.getDate()+7):r==='m'?t.setMonth(t.getMonth()+1):t.setFullYear(t.getFullYear()+1);return iso(t)};
const pr=(m,def)=>{const r=prompt(m,def);return r&&r.trim()?r.trim():null},it2=i=>{const[g,k]=i.split('|'),G=S.groups.find(a=>a.id===g);return[G,G.it.find(a=>a.id===k)]},up=()=>{save();render()};
const H={nv:i=>{v=i;render()},tb:i=>{f.tab=i;render()},fc:i=>{f.cat=i;render()},co:()=>{f.open=!f.open;$('#lst').innerHTML=lst()},add:()=>openSheet(),ed:i=>openSheet(i),

clr:()=>{if(confirm(T('مسح كل المهام المنجزة؟','Clear all completed tasks?'))){S.tasks=S.tasks.filter(x=>!x.x);up()}},
qd:i=>{sync();const t=new Date();t.setDate(t.getDate()+ +i);D.d=iso(t);draw()},pr:i=>{sync();D.p=+i;draw()},cc:i=>{sync();D.c=i;draw()},
as:()=>{sync();const e=$('#fs').value.trim();if(e){D.sub.push({t:e,x:0});draw()}},rs:i=>{sync();D.sub.splice(+i,1);draw()},ts:i=>{sync();D.sub[+i].x=D.sub[+i].x?0:1;draw()},
cx:()=>{D=null;$('#sh').hidden=1},sv:()=>{sync();if(!D.t.trim())return toast(T('اكتب عنوان المهمة','Enter a title'));D.t=D.t.trim();D.fr=[];
const n=S.tasks.findIndex(x=>x.id===D.id);if(n<0)S.tasks.push(D);else{if(S.tasks[n].lk!==D.lk&&S.tasks[n].x){lkd(S.tasks[n],-1);D.x&&lkd(D,1)}S.tasks[n]=D}
if(D.c&&!S.cats.includes(D.c))S.cats.push(D.c);D=null;$('#sh').hidden=1;up();pins()},
og:i=>{P={g:i,i:null};render()},oi:i=>{P.i=i;render()},bk:()=>{P.i?P.i=null:P.g=null;render()},
ag:()=>{const n=pr(T('اسم القسم؟ (مثال: مواد الكلية)','Section name?'));if(n){S.groups.push({id:uid(),n,it:[]});up()}},
ai:i=>{const n=pr(T('اسم المادة أو المشروع؟','Name?'));if(!n)return;const t=parseInt(pr(T('العدد الكلي للمحاضرات/الأجزاء؟','Total lectures/parts?'),'10'));if(t>0){S.groups.find(a=>a.id===i).it.push({id:uid(),n,total:t,ls:[]});up()}},
dg:i=>{if(confirm(T('حذف القسم بكل ما فيه؟','Delete section?'))){S.groups=S.groups.filter(a=>a.id!==i);P={g:null,i:null};up()}},
al:()=>{const e=$('#nl'),I=cur(),a=e.value.split(/[,،]/).map(x=>x.trim()).filter(Boolean);if(!a.length)a.push(T('محاضرة ','Lecture ')+(I.ls.length+1));a.forEach(n=>I.ls.push({id:uid(),n,at:Date.now()}));up()},
rl:i=>{const I=cur();I.ls=I.ls.filter(l=>l.id!==i);up()},el:i=>{const l=cur().ls.find(a=>a.id===i),n=pr(T('اسم المحاضرة؟','Lecture name?'),l.n);if(n){l.n=n;up()}},
et:()=>{const I=cur(),t=parseInt(pr(T('العدد الكلي؟','Total?'),I.total));if(t>0){I.total=t;up()}},
di:()=>{if(confirm(T('حذف المادة؟','Delete?'))){const G=S.groups.find(a=>a.id===P.g);G.it=G.it.filter(a=>a.id!==P.i);P.i=null;up()}},
rmt:i=>{sync();const r=+i;D.rms=D.rms.includes(r)?D.rms.filter(z=>z!==r):[...D.rms,r];draw()},ct:()=>{sync();D.tm='';draw()},
qt:i=>{sync();const t=new Date();if(i==='h')t.setHours(t.getHours()+1);else if(i==='n')t.setHours(20,0,0,0);else{t.setDate(t.getDate()+1);t.setHours(9,0,0,0)}D.d=iso(t);D.tm=p2(t.getHours())+':'+p2(t.getMinutes());if(!D.rms.length)D.rms=[0];draw()},
qa:()=>{const t=nlp($('#qa').value);if(!t)return toast(T('اكتب المهمة','Type a task'));S.tasks.push(t);up();toast('✓ '+t.t+(t.d?' · '+fdt(t.d,t.tm):''))},
nat:async()=>{try{await LN.requestPermissions();const e=await LN.checkExactNotificationSetting();if(e.exact_alarm!=='granted')await LN.changeExactNotificationSetting();sched()}catch(x){}},
inst:()=>ip?ip.prompt():toast(T('افتح قائمة كروم ⋮ واختر «تثبيت التطبيق»','Chrome menu ⋮ → Install app')),
st:(i,b)=>{S[b.dataset.k]=i;up()},en:()=>{if(!('Notification'in window))return toast(T('المتصفح لا يدعم الإشعارات','Not supported'));Notification.requestPermission().then(()=>{render();pins()})},
ex:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='progress-backup-'+iso(new Date())+'.json';a.click()},im:()=>$('#imp').click()};
document.addEventListener('click',e=>{if(e.target.id==='sh')return H.cx();const b=e.target.closest('[data-a]');if(b&&H[b.dataset.a])H[b.dataset.a](b.dataset.i,b)});
document.addEventListener('input',e=>{if(e.target.id==='q'){f.q=e.target.value.toLowerCase();$('#lst').innerHTML=lst()}});
$('#imp').addEventListener('change',e=>{const r=new FileReader();r.onload=()=>{try{S=Object.assign({lang:'ar',th:'light',fs:'m',tasks:[],groups:[],cats:[]},JSON.parse(r.result));mig();up();toast('✓')}catch(x){toast(T('ملف غير صالح','Invalid file'))}};r.readAsText(e.target.files[0])});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='nl')H.al();if(e.target.id==='qa')H.qa()}});const CAP=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()),LN=CAP?Capacitor.Plugins.LocalNotifications:null;
const hid=s=>{let x=7;for(const c of s)x=(x*31+c.charCodeAt(0))|0;return Math.abs(x)%2e9+1};
const rl=r=>r>=1440?T('يوم','1 day'):r>=60?r/60+T(' ساعة',' h'):r+T(' د',' min');
const cd=x=>{const d=due(x);if(!d)return'';let m=Math.round((d-Date.now())/6e4);const o=m<0;m=Math.abs(m);const t=m>=1440?Math.floor(m/1440)+T(' يوم',' d'):m>=60?Math.floor(m/60)+T(' س',' h')+(m%60?' '+m%60+T(' د',' m'):''):m+T(' د',' m');return o?T('متأخرة ','Overdue ')+t:T('باقي ','in ')+t};
let wl0=0;function wset(){const[h,m]=(D.tm||'09:00').split(':').map(Number);wl0=Date.now()+600;$('#wh').scrollTop=h*40;$('#wm').scrollTop=m*40}
document.addEventListener('scroll',e=>{const c=e.target;if(D&&c.classList&&c.classList.contains('wc')&&Date.now()>wl0){clearTimeout(wset.t);wset.t=setTimeout(()=>{D.tm=p2(Math.round($('#wh').scrollTop/40))+':'+p2(Math.round($('#wm').scrollTop/40));$('#tl').textContent=D.tm;if(!D.rms.length){D.rms=[0]}},150)}},true);
function nlp(s){s=s.replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c));const now=new Date();let d=new Date(),dt='',tm='',m;const cut=r=>{const k=s.match(r);if(k)s=s.replace(k[0],' ');return k},hm=(h,i)=>p2(h)+':'+p2(i||0);
if(m=cut(/(?:بعد|in)\s*(\d+)\s*(ساع\S*|دقيق\S*|دقائق|يوم|أيام|ايام|hours?|mins?|minutes?|days?)/i)){const u=m[2],k=/ساع|hour/i.test(u)?36e5:/دق|min/i.test(u)?6e4:864e5;d=new Date(+now+ +m[1]*k);dt=iso(d);if(k<864e5)tm=hm(d.getHours(),d.getMinutes())}
else{if(cut(/بعد\s*(بكرة|بكره|غد)/)){d.setDate(d.getDate()+2);dt=iso(d)}else if(cut(/بكرة|بكره|غدا|غداً|tomorrow/i)){d.setDate(d.getDate()+1);dt=iso(d)}else if(cut(/الليلة|tonight/i)){dt=iso(d);tm='20:00'}else if(cut(/النهاردة|النهارده|اليوم|today/i))dt=iso(d);else if(cut(/(?:الأسبوع|الاسبوع|اسبوع)\s*(?:الجاي|الجاى|القادم)|next week/i)){d.setDate(d.getDate()+7);dt=iso(d)}
const P=/عصر|مغرب|مساء|ليل|عشاء|pm/i,A=/صباح|صبح|فجر|am/i,Z=/ظهر|ضهر/i,fx=(h,p)=>P.test(p)?(h<12?h+12:h):A.test(p)?(h===12?0:h):Z.test(p)?(h<7?h+12:h):h;
if(m=cut(/(?:(?:الساعة|الساعه|at)\s*)?(\d{1,2})(?::(\d{2}))?\s*(صباح\S*|الصبح|الفجر|الظهر|الضهر|ظهر\S*|عصر\S*|العصر|المغرب|مغرب|مساء\S*|بالليل|الليل|العشاء|pm|am)/i))tm=hm(fx(+m[1],m[3]),+m[2]);else if(m=cut(/(?:الساعة|الساعه|at)\s*(\d{1,2})(?::(\d{2}))?/i))tm=hm(+m[1],+m[2]);else if(m=cut(/(\d{1,2}):(\d{2})/))tm=hm(+m[1],+m[2])}
const t=s.replace(/\s+/g,' ').trim();if(!t)return null;if(tm&&!dt){d=new Date();const[h,i]=tm.split(':').map(Number);d.setHours(h,i,0,0);if(d<now)d.setDate(d.getDate()+1);dt=iso(d)}
return{id:uid(),t,n:'',d:dt,tm,rms:tm?[0]:[],rp:'',p:2,c:'',pin:true,sub:[],lk:'',x:0}}
async function sched(){if(!LN)return;try{const pd=await LN.getPending();if(pd.notifications.length)await LN.cancel({notifications:pd.notifications});
const now=Date.now(),N=[],want=new Set(),gone=new Set(S.pin||[]);
S.tasks.forEach(x=>{const ex={tid:x.id};if(x.x){gone.add(hid('p'+x.id));gone.add(hid(x.id+'|s'));(x.rms||[]).forEach(r=>gone.add(hid(x.id+'|'+r)));return}const d=due(x);
if(d)(x.rms||[]).forEach(r=>{const at=d-r*6e4;if(at>now)N.push({id:hid(x.id+'|'+r),title:x.t,body:(r?T('بعد ','In ')+rl(r):T('حان الآن','Due now'))+(x.n?' · '+x.n:''),channelId:'rem',actionTypeId:'task',extra:ex,schedule:{at:new Date(at),allowWhileIdle:true}})});
if(x.sn>now)N.push({id:hid(x.id+'|s'),title:'⏰ '+x.t,body:T('تذكير مؤجَّل','Snoozed reminder'),channelId:'rem',actionTypeId:'task',extra:ex,schedule:{at:new Date(x.sn),allowWhileIdle:true}});
if(x.pin&&x.p>=2){const i=hid('p'+x.id);want.add(i);N.push({id:i,title:x.t,body:(x.p>2?T('مهمة مهمة جدًا','Very important'):T('مهمة متوسطة','Medium'))+(x.d?' · '+fdt(x.d,x.tm):''),channelId:'pin',ongoing:true,autoCancel:false,actionTypeId:'task',extra:ex})}});
want.forEach(i=>gone.delete(i));if(gone.size)await LN.removeDeliveredNotifications({notifications:[...gone].map(id=>({id}))});
S.pin=[...want];try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(N.length)await LN.schedule({notifications:N})}catch(e){}}
async function initN(){if(!LN)return;try{await LN.requestPermissions();await LN.createChannel({id:'rem',name:T('تذكيرات المهام','Task reminders'),importance:5,vibration:true});await LN.createChannel({id:'pin',name:T('مهام ثابتة','Pinned tasks'),importance:2});
await LN.registerActionTypes({types:[{id:'task',actions:[{id:'snooze',title:T('تأجيل 10 د','Snooze 10m')},{id:'done',title:T('تم ✓','Done ✓')}]}]});
LN.addListener('localNotificationActionPerformed',e=>{const x=S.tasks.find(a=>a.id===(e.notification.extra||{}).tid);if(!x)return;if(e.actionId==='done'&&!x.x)H.tg(x.id);else if(e.actionId==='snooze'){x.sn=Date.now()+6e5;save();toast(T('تم التأجيل 10 دقائق','Snoozed 10 min'))}});sched()}catch(e){}}
const gr=()=>'Notification'in window&&Notification.permission==='granted';
async function ntf(ti,bo,tag,pin){if(!gr())return false;try{const r=await navigator.serviceWorker.ready;await r.showNotification(ti,{body:bo,tag,icon:'icon-192.png',requireInteraction:pin,silent:pin,data:{pin,title:ti,body:bo}});return true}catch(e){return false}}
async function pins(){if(!gr())return;try{const r=await navigator.serviceWorker.ready,w=S.tasks.filter(x=>!x.x&&x.pin&&x.p>=2),cur=await r.getNotifications(),tg=new Set(w.map(x=>'pin-'+x.id));
cur.forEach(n=>{if(n.tag.startsWith('pin-')&&!tg.has(n.tag))n.close()});const have=new Set(cur.map(n=>n.tag));
w.forEach(x=>{if(!have.has('pin-'+x.id))ntf(x.t,(x.p>2?T('مهمة مهمة جدًا','Very important'):T('مهمة متوسطة','Medium'))+(x.d?' · '+fdt(x.d,x.tm):''),'pin-'+x.id,true)})}catch(e){}}
function tick(){if(LN)return;const n=Date.now();S.tasks.forEach(x=>{const d=due(x);if(x.x||!d)return;x.fr=x.fr||[];(x.rms||[]).forEach(r=>{if(!x.fr.includes(r)&&n>=d-r*6e4&&n<d+864e5){x.fr.push(r);save();ntf(x.t,r?T('بعد ','In ')+rl(r):T('حان موعد المهمة','Task is due'),'rm-'+x.id+r,false).then(ok=>ok||toast('🔔 '+x.t))}})})}
if(!CAP&&'serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').then(()=>pins()).catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();pins();sched();render()}});
setInterval(()=>{tick();clock();if(v==='todo'&&$('#lst')&&$('#sh').hidden&&document.activeElement.tagName!=='INPUT')$('#lst').innerHTML=lst()},20000);render();tick();initN();
